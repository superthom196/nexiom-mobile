# Needs JDK 17+ (Gradle >= 9.1). build.sh uses Android Studio's own JDK; otherwise set
# org.gradle.java.home in your own ~/.gradle/gradle.properties (not this file, which is committed).
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
