name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach the APK to
        required: true

permissions:
  contents: write

jobs:
  # Without the keystore secrets there is nothing to sign with, so the release job is skipped,
  # not failed; build.sh signs locally with signing.properties instead.
  signing-key:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No KEYSTORE_BASE64 secret, so no APK is built here."
          fi

  release:
    needs: signing-key
    if: needs.signing-key.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - name: Size the build for a 7 GB runner
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
          kotlin.compiler.execution.strategy=in-process
          PROPS

      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nexiom.jks"

      - name: Assemble the signed release build
        env:
          NEXIOM_KEYSTORE_PATH: ${{ runner.temp }}/nexiom.jks
          NEXIOM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          NEXIOM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          NEXIOM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Check it is signed with the release key, not the debug key
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          certs=$("$apksigner" verify --print-certs androidApp/build/outputs/apk/release/androidApp-release.apk)
          if grep -q 'CN=Android Debug' <<<"$certs"; then
            echo "::error::APK is debug-signed; the keystore secrets were not picked up."
            exit 1
          fi

      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # The box's phone setup downloads the asset matching nexiom-*.apk.
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "nexiom-${TAG#v}.apk"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "Nexiom $TAG" --generate-notes
          gh release upload "$TAG" "nexiom-${TAG#v}.apk" --clobber
