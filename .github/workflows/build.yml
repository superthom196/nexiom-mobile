name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # versionName and versionCode come from `git describe --tags` and the commit count,
          # so the default shallow clone would build 0.0.0 (1).
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - name: Size the build for a 7 GB runner
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
          kotlin.compiler.execution.strategy=in-process
          PROPS

      - name: Unit tests
        run: ./gradlew :shared:testAndroidHostTest

      - name: Assemble the release build
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@v7
        with:
          name: nexiom-apk
          path: androidApp/build/outputs/apk/release/androidApp-release.apk
          if-no-files-found: error
